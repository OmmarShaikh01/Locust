[package]
name = "locust"
version = "0.0.2"
edition = "2024"
rust-version = "1.88"
description = "Native Rust GPUI cockpit and daemon for multi-agent swarms over the Agent Client Protocol"
license = "MIT"
readme = "README.md"
keywords = ["gpui", "agents", "acp", "llm", "cockpit"]
categories = ["command-line-utilities", "development-tools", "gui"]
default-run = "locust"

[dependencies]
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.4", features = ["derive"] }
agent-client-protocol = "5.0.0"
serde_yaml = "0.9.34"
interprocess = "2.4.8"
gpui = "0.2.2"
flume = "0.11"
